name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = TechSupport
        package.name = techsupport
        package.domain = org.example
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,txt,json
        version = 1.0
        requirements = python3,kivy
        orientation = portrait
        fullscreen = 1
        android.permissions = INTERNET
        android.api = 30
        android.minapi = 21
        android.ndk = 25b
        android.sdk = 30
        android.archs = armeabi-v7a
        android.accept_sdk_license = True
        [buildozer]
        log_level = 2
        warnings_filter = ignore
        EOF
    
    - name: Install buildozer and build APK
      run: |
        docker run --rm -v ${PWD}:/app -w /app kivy/kivy:latest /bin/bash -c "
          apt update && apt install -y dialog && \
          echo 'yes' | buildozer init
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec
          sed -i 's/^android.api = .*/android.api = 30/' buildozer.spec
          sed -i 's/^android.minapi = .*/android.minapi = 21/' buildozer.spec
          sed -i 's/^android.ndk = .*/android.ndk = 25b/' buildozer.spec
          sed -i 's/^android.archs = .*/android.archs = armeabi-v7a/' buildozer.spec
          echo 'yes' | buildozer android debug
        "
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: techsupport-apk
        path: bin/*.apk
