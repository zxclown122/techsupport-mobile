name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y python3-pip python3-venv zip unzip openjdk-17-jdk autoconf libtool pkg-config
        pip install buildozer cython
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = TechSupport
        package.name = techsupport
        package.domain = org.example
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,txt,json
        version = 1.0
        requirements = python3,kivy
        orientation = portrait
        fullscreen = 1
        android.permissions = INTERNET
        android.api = 30
        android.minapi = 21
        android.ndk = 23c
        android.sdk = 30
        android.archs = armeabi-v7a
        android.accept_sdk_license = True
        [buildozer]
        log_level = 2
        EOF
    
    - name: Create keystore (debug)
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US" -storepass android -keypass android
        echo "export P4A_RELEASE_KEYSTORE=~/.android/debug.keystore" >> ~/.bashrc
        echo "export P4A_RELEASE_KEYALIAS=androiddebugkey" >> ~/.bashrc
        echo "export P4A_RELEASE_KEYSTORE_PASS=android" >> ~/.bashrc
        echo "export P4A_RELEASE_KEYALIAS_PASS=android" >> ~/.bashrc
    
    - name: Build APK
      run: |
        buildozer android debug
        ls -la bin/
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: techsupport-apk
        path: bin/*.apk
