name: Build APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          sudo apt-get install -y unzip
          sudo apt-get install -y autoconf
          sudo apt-get install -y automake
          sudo apt-get install -y libtool
          sudo apt-get install -y pkg-config
          sudo apt-get install -y cmake
          sudo apt-get install -y libffi-dev
          sudo apt-get install -y libssl-dev git

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.33
          pip install buildozer==1.5.0
          pip install python-for-android==2024.1.21

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << EOF
          [app]
          title = TechSupport
          package.name = techsupport
          package.domain = org.example
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,ttf,txt,json,db,sqlite
          version = 1.0
          requirements = python3,kivy==2.3.0,openssl,pyjnius
          orientation = portrait
          fullscreen = 1
          android.permissions = android.permission.INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE
          android.api = 31
          android.minapi = 21
          android.ndk = 25b
          android.archs = arm64-v8a,armeabi-v7a
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          EOF

      - name: Clean
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          java -version
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: techsupport-apk
          path: bin/*.apk
