name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build APK with Docker
      run: |
        docker run --rm -v ${PWD}:/app -w /app -e BUILD_ALLOW_ROOT=1 kivy/buildozer:latest buildozer android debug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: techsupport-apk
        path: bin/*.apk
